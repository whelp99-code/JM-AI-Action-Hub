name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: jm-ai-action-hub-focus-suite-v0.9.0-ios-v0.2.1/server

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor declared in pyproject requires-python; 3.14 is what development runs on.
        python-version: ['3.12', '3.14']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: jm-ai-action-hub-focus-suite-v0.9.0-ios-v0.2.1/server/pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'

      - name: Verify
        env:
          PYTHON: python
          RUFF: ruff
        run: ./scripts/verify.sh
