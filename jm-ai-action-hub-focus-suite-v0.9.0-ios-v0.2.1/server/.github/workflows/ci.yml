name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[dev]'
      - run: ruff check .
      - run: pytest -W error --cov=action_hub --cov-fail-under=80 --cov-report=term-missing
      - run: python -m compileall -q action_hub scripts/mobile_http_smoke.py
      - run: python scripts/export_openapi.py --check
      - run: node --check action_hub/web/app.js
      - run: node --check action_hub/web/share-target.js
      - run: python -m pip wheel --no-deps --no-build-isolation . -w dist
      - run: docker build -t jm-ai-action-hub:ci .
