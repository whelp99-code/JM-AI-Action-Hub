name: ios-ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Deterministic project and OpenAPI checks
        run: |
          python3 scripts/generate_xcodeproj.py --check
          python3 scripts/verify_openapi_contract.py
          python3 scripts/validate_ios_project.py
      - name: Plist validation
        run: |
          find Config ActionHubApp/Resources -type f \( -name '*.plist' -o -name '*.entitlements' -o -name '*.xcprivacy' \) -print0 | xargs -0 -n1 plutil -lint
      - name: Swift formatting
        run: |
          xcrun swift-format lint --strict --recursive ActionHubApp ActionHubShareExtension ActionHubWidgetExtension Packages/ActionHubCore/Sources Packages/ActionHubCore/Tests
      - name: Core tests
        run: swift test --package-path Packages/ActionHubCore
      - name: iOS Simulator build
        run: |
          xcodebuild \
            -project JM-AI-Action-Hub-iOS.xcodeproj \
            -scheme ActionHubApp \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
